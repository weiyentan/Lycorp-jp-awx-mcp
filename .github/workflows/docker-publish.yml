name: Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/weiyentan/lycorp-jp-awx-mcp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=AWX MCP Server
            org.opencontainers.image.description=MCP server for AWX/Ansible Tower

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image starts
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          # Prefer sha tag for verification; fallback to inspecting metadata outputs
          IMAGE="ghcr.io/weiyentan/lycorp-jp-awx-mcp:sha-${SHORT_SHA}"
          # On tag builds the semver tag may be more canonical, also verify latest if on main
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            # strip leading v for naked version check
            NAKED="${VERSION#v}"
            if docker pull "ghcr.io/weiyentan/lycorp-jp-awx-mcp:${NAKED}" 2>/dev/null; then
              IMAGE="ghcr.io/weiyentan/lycorp-jp-awx-mcp:${NAKED}"
            fi
          fi
          echo "Verifying image: $IMAGE"
          docker pull "$IMAGE"
          # Smoke test 1: image can run --help (no network needed)
          docker run --rm --entrypoint="" "$IMAGE" uv run --no-sync awx-mcp --help
          # Smoke test 2: start server and probe HTTP endpoint
          docker run -d --name awx-mcp-verify \
            -e ANSIBLE_BASE_URL=https://awx.example.com \
            -e ANSIBLE_TOKEN=dummy-token-for-verify \
            -p 8000:8000 \
            "$IMAGE"
          # Wait for server to become reachable (any HTTP response counts as healthy)
          for i in $(seq 1 15); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/mcp || true)
            if [ "$STATUS" != "000" ] && [ -n "$STATUS" ]; then
              echo "Server responded with HTTP $STATUS after $i attempt(s) - healthy"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "::error::Server did not respond within 30s"
              docker logs awx-mcp-verify || true
              docker rm -f awx-mcp-verify || true
              exit 1
            fi
            sleep 2
          done
          docker logs awx-mcp-verify || true
          if [ "$(docker inspect -f '{{.State.Running}}' awx-mcp-verify)" != "true" ]; then
            echo "::error::Container is not running"
            docker logs awx-mcp-verify || true
            docker rm -f awx-mcp-verify || true
            exit 1
          fi
          echo "Image verification succeeded: $IMAGE"
          docker rm -f awx-mcp-verify
